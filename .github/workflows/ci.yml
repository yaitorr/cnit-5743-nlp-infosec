name: ci

# Lint and test every pull request into main, so reviewers see objective evidence for the
# Definition of Done item "ruff check and pytest pass".
#
# Scope: only the shared base and dev dependencies are installed. The Sentinel and d1 extras are
# deliberately NOT installed (large, and d1 downloads model weights), so nothing that needs them is
# covered here. See the "Checks" section of the README for what this does and does not cover.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # a Windows-only failure should not hide a Linux result
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # All actions are pinned to full commit SHAs rather than movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.26" # exact, same as pages.yml
          python-version: "3.12"
          enable-cache: false # small dependency set; keep runs hermetic

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install shared and dev dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
