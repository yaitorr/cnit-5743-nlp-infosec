project_name: "CNIT-574: Model Analysis"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done:
  - "If code changed: ruff check and pytest pass"
  - "No data, derived artifacts, or raw chat text committed or displayed (hygiene test passes)"
  - "If output was produced (table, figure, page): rendered result inspected, not just executed"
  - "Steps to reproduce recorded (commands, seeds, pinned versions and model revisions)"
  - "Decisions and reasoning written down, and the owner can explain them without help"
